<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숲의 입구</title>

<style>

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:sans-serif;
  transition:all 2s ease;

   background:
  radial-gradient(
    circle at top,
    rgba(180,140,255,0.25),
    transparent 45%
  ),
  linear-gradient(
    135deg,
    #241339,
    #1b3e5d,
    #18432b
  );

  transition:all 2s ease;
}

/* 어두운 오버레이 */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:rgba(20,30,20,0.35);
  transition:2s;
  z-index:0;
}

body.open{
  background:
  radial-gradient(
    circle at top,
    rgba(240,200,255,0.03),
    transparent 55%
  ),
  linear-gradient(
    135deg,
    #6d4acb,
    #5b8fd4,
    #6ccf86
  );
}
/* 전체 컨테이너 */
.container{
  position:relative;
  z-index:10;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:30px;
}

/* 캐릭터 영역 */
.item{
  position:relative;
  }

/* 코알라 뒤 배경 */

/* 코알라 */
#koala{
  width:260px;
  position:relative;
  z-index:10;
}

/* 윙크할 때 살짝 점프 */
.koala-wink{
  animation:winkJump 1.2s ease;
}

@keyframes winkJump{
  0%{transform:translateY(0);}
  30%{transform:translateY(-15px);}
  60%{transform:translateY(-5px);}
  100%{transform:translateY(0);}
}

/* 꽃 */
.flower{
  position:absolute;
  top:-10px;
  left:45%;
  transform:translateX(-50%);
  cursor:pointer;
  animation:sway 3s ease-in-out infinite;
  z-index:20;
}

.flower img{
  width:120px;
}

@keyframes sway{
  0%{transform:translateX(-50%) rotate(-4deg);}
  50%{transform:translateX(-50%) rotate(4deg);}
  100%{transform:translateX(-50%) rotate(-4deg);}
}
 /* 클릭 글씨*/ 
.f1{
  display:inline-block;
  color:#ffd54f;
  font-size:0.75rem;

  padding:4px 8px;

  border:1px solid #ffd54f;
  border-radius:15px;

  background:rgba(0,0,0,0.2);

  text-shadow:1px 1px 3px black;

  animation:blink 1.2s infinite alternate;
}

.f1::before{
  content:"🌸 ";
}

@keyframes blink{
  from{opacity:0.5;}
  to{opacity:1;}
}
  
/* 환영 문구 */
.welcome{
  position:fixed;
  top: 15%;
  left:51%;
  transform:translateX(-50%);
  font-size:1.3rem;
  color:#eaffea;
  opacity:0;
  transition:2s;
  z-index:50;
  text-shadow:0 0 10px rgba(0,0,0,0.5);
}

.welcome.show{
  opacity:1;
}

/* 메뉴 */
.wrap{
  text-align:center;
  max-width:400px;
  z-index:10;
  }

.wrap a{
  display:block;
  padding:12px;
  margin:10px 0;
  border-radius:16px;
  background:#e6efe9;
  text-decoration:none;
  color:#27423b;
  transform:scale(0);
  opacity:0;
  transition:all .6s ease;
  }

.wrap a.show{
  transform:scale(1);
  opacity:1;
}

/* 꽃잎 */
.petal{
  position:fixed;
  width:30px;
  pointer-events:none;
  z-index:999;
}

/* 반딧불 */
.firefly{
  position:fixed;
  width:10px;
  pointer-events:none;
  opacity:0.8;
  z-index:999;
  animation:float 6s infinite ease-in-out;
}

@keyframes float{
  0%{transform:translate(0,0);}
  50%{transform:translate(30px,-40px);}
  100%{transform:translate(0,0);}
}

</style>
</head>

<body>

<div class="welcome" id="welcome">
  숲에 오신 걸 환영해요 
</div>

<div class="container">

  <div class="item">

    <!-- 꽃 -->
    <div class="flower" id="flower">
      <img src="flower.png" alt="">
    </div>

    <!-- 코알라 -->
    <img src="koala1.png" id="koala" alt="코알라">
  <div class=f1> click~</div>
  </div>

  <div class="wrap">
    <a href="plate0.html"> 빈 접시 전시 </a>
    <a href="seasonal3.html">숲으로 </a>
    <a href="프로필1.html", style="display:none;">ABOUT</a>
    <a href="sns비스킷.html", style="display:none;">버터토끼 루틴</a>
  </div>

</div>

<script>

const flower = document.getElementById('flower');
const welcome = document.getElementById('welcome');
const links = document.querySelectorAll('.wrap a');
const koala = document.getElementById('koala');

flower.addEventListener('click',()=>{

  /* 코알라 윙크 */
  koala.src='koala2.png';
  koala.classList.add('koala-wink');

  setTimeout(()=>{
    koala.src='koala1.png';
    koala.classList.remove('koala-wink');
  },1200);

  document.body.classList.add('open');

  const rect = flower.getBoundingClientRect();

  /* 꽃 사라짐 */
  flower.style.animation='none';
  flower.style.transform='translateX(-50%) scale(0)';
  flower.style.opacity='0';
  
    /* 꽃잎 생성 */
  for(let i=0;i<70;i++){

    const petal=document.createElement('img');

    petal.src='petal.png';
    petal.className='petal';

    petal.style.left=(rect.left + rect.width/2)+'px';
    petal.style.top=(rect.top + rect.height/2)+'px';

    document.body.appendChild(petal);

    const x=(Math.random()-0.5)*window.innerWidth;
    const up=-200-Math.random()*200;
    const down=500+Math.random()*300;

    petal.animate([
      {transform:'translate(0,0)',opacity:1},
      {
        offset:0.3,
        transform:`translate(${x}px,${up}px)`,
        opacity:1
      },
      {
        transform:`translate(${x*1.2}px,${down}px)`,
        opacity:0
      }
    ],{
      duration:5000,
      easing:'ease-in-out',
      fill:'forwards'
    });

    setTimeout(()=>{
      petal.remove();
    },5000);
  }

  /* 반딧불 생성 */
  for(let i=0;i<12;i++){

    const f=document.createElement('img');

    f.src='firefly.png';
    f.className='firefly';

    f.style.left=Math.random()*window.innerWidth+'px';
    f.style.top=Math.random()*window.innerHeight+'px';

    document.body.appendChild(f);
    flower.style.pointerEvents='none';
  }
  
  /* 환영 문구 */
  setTimeout(()=>{
    welcome.classList.add('show');
  },800);

  /* 메뉴 등장 */
  links.forEach((link,i)=>{

    setTimeout(()=>{
      link.classList.add('show');
    },1200+i*500);

  });

});

</script>

</body>
</html>
