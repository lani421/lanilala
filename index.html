<!DOCTYPE html>
<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>하트숲에서</title>

  <style>
    /* 기본 설정 */
    body {
      font-family: 'NanumSquare', sans-serif;
      background: linear-gradient(180deg, #f9f8f4 0%, #eceae4 100%);
      color: #2e3a33;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .wrap {
      width: 100%;
      max-width: 440px;
      padding: 50px 25px;
      text-align: center;
      background: rgba(255,255,255,0.85); /* 미묘한 깊이감 */
      border-radius: 16px;
      box-shadow: 0 12px 25px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    p {
      font-size: 1rem;
      color: #55645d;
      margin-bottom: 35px;
      line-height: 1.6;
      font-style: italic; /* 성찰적 느낌 강조 */
    }

    a {
      display: block;
      padding: 16px;
      margin-bottom: 16px;
      border-radius: 12px;
      text-decoration: none;
      color: #2c3a32;
      background: #e4eee7;
      font-weight: 500;
      transition: all 0.25s ease;
      box-shadow: 0 6px 12px rgba(0,0,0,0.04);
    }

    a:hover {
      background: #d0dfd6;
      box-shadow: 0 10px 18px rgba(0,0,0,0.08);
      transform: translateY(-2px);
    }

    /* 아이콘/이모지 간격 */
    a span {
      margin-right: 6px;
    }
  </style>
</head>
