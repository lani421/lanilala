<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>버터토끼의 작은 비스킷 인사 한 조각</title>

<!-- GSAP (CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Pretendard","Noto Sans KR",sans-serif;
}

body{
    background: linear-gradient(180deg,#fff8ef,#ffe8d2);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
    text-align:center;
}

/* 타이틀 */
.title h1{
    font-size:1.6rem;
    color:#7a4f3c;
}

.title p{
    color:#a07a6b;
    margin-top:6px;
}

/* 카드 */
.card{
    margin-top:25px;
    background:#ffd89a;
    border-radius:40px;
    padding:40px 25px;
    box-shadow:0 15px 35px rgba(0,0,0,.08);
    position:relative;
    overflow:hidden;
}

/* 점무늬 */
.card::before{
    content:"";
    position:absolute;
    inset:20px;
    background-image: radial-gradient(#c98f4f 2px, transparent 3px);
    background-size:28px 28px;
    opacity:.25;
}

/* 내용 */
.content{
    position:relative;
    z-index:2;
}

/* 질문 */
.question{
    font-size:1.4rem;
    font-weight:700;
    color:#5b3d2f;
    margin-bottom:25px;
}

/* 버튼 */
.buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
}

button{
    border:none;
    padding:12px 16px;
    border-radius:14px;
    background:#fffaf4;
    cursor:pointer;
    transition:.2s;
    font-size:1rem;
    color:#6a4f3f;
}

button:hover{
    transform:translateY(-2px);
    background:#fff;
}

/* 토끼 */
.rabbit{
    width:220px;
    margin:20px auto 0;
    display:none;
}

.rabbit.show{
    display:block;
}

/* 답장 */
.reply{
    margin-top:20px;
    font-size:1.2rem;
    color:#4b362a;
    min-height:80px;
}

/* 마지막 메시지 */
.end{
    margin-top:25px;
    opacity:0;
    transition:.4s;
    color:#7b5c4b;
}

.end.show{
    opacity:1;
}

/* 버튼 이동 */
.journalBtn{
    display:none;
    margin-top:20px;
    padding:14px 22px;
    border-radius:18px;
    background:#ff9f43;
    color:white;
    font-size:1rem;
}

</style>
</head>

<body>

<div class="container">

    <div class="title">
        <h1>🐰 버터토끼</h1>
        <p>오늘도 비스킷 한 조각</p>
    </div>

    <div class="card">

        <div class="content">

            <!-- 질문 -->
            <div class="question" id="question">
                오늘 비스킷 한 조각 먹고 갈래?
            </div>

            <!-- 버튼 -->
            <div class="buttons">
                <button onclick="talk('yes')">🍪 응</button>
                <button onclick="talk('no')">🍪 아니</button>
                <button onclick="talk('maybe')">🍪 글쎄</button>
                <button onclick="talk('dontknow')">🍪 모르겠어</button>
                <button onclick="talk('secret')">🍪 비밀</button>
            </div>

            <!-- 토끼 -->
            <img id="rabbit" class="rabbit" src="rabbit_default.png">

            <!-- 답장 -->
            <div id="reply" class="reply">
                버터토끼가 기다리고 있어…
            </div>

            <!-- 마지막 메시지 -->
            <div id="end" class="end"></div>

            <!-- journal 이동 -->
            <button id="journalBtn" class="journalBtn"
            onclick="location.href='journal.html'">
                🍪 오늘의 비스킷 받기
            </button>

        </div>
    </div>

</div>

<script>

-------------------------- */

    secret:"rabbit_magic.png"
};

/* --------------------------

-------------------------- */

/* --------------------------
   주간 메시지 (9단계)
-------------------------- */
const endings = {
1:"씨앗은 조용히 자라고 있어.",

3:"줄기가 하늘을 향해 올라가고 있어.",

5:"바람이 흔들어도 괜찮아.",
6:"초록이 조용히 퍼지고 있어.",
7:"꽃이 피어날 준비를 하고 있어.",
8:"열매가 맺히는 시간.",
9:"이제 숲이 되었어.",

15:"햇살을 하나 주머니에 넣어둘까?",
16:"조심히 가.",
17:"오늘도 수고했어.",
18:"작은 평온이 함께하길.",
19:"다음 질문은 나중에 물어볼게."

/* --------------------------
   현재 Day (임시)
-------------------------- */
let day = parseInt(localStorage.getItem("day")) || 1;

/* --------------------------
   메인 함수
-------------------------- */
function talk(type){

    const rabbit = document.getElementById("rabbit");
    const reply = document.getElementById("reply");
    const end = document.getElementById("end");

    /* GSAP 자리 1 - 토끼 등장 */
    // gsap.from("#rabbit", {scale:0, duration:0.5, ease:"back.out"});

    rabbit.src = rabbitImages[type];
    rabbit.classList.add("show");

    const r = replies[type];
    const text = r[Math.floor(Math.random()*r.length)];

    reply.innerText = " " + text;

    /* GSAP 자리 2 - 답장 등장 */
    // gsap.from("#reply", {opacity:0, y:10});

    end.innerText = "🍪 " + endings[Math.ceil(day/7)];
    end.classList.add("show");

    /* journal 버튼 표시 */
    document.getElementById("journalBtn").style.display = "block";

    /* GSAP 자리 3 - 버튼 등장 */
    // gsap.from("#journalBtn", {scale:0.8, opacity:0});
}

</script>

</body>
</html>
