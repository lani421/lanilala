<!DOCTYPE html> 
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>버터토끼 루틴 & 응원</title>

<style>
body {
  font-family: 'NanumSquare', sans-serif;
  margin:0;
  padding:0;
  background:#fff7ee;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
}
.container {
  max-width: 500px;
  width:90%;
  text-align:center;
  padding:20px;
  border-radius:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
  background:#fff;
  margin-top:20px;
}
header img {
  width:120px;
  margin-bottom:10px;
}
h1 {
  color:#ff8c42;
  margin:5px 0 15px;
  font-size:1.6rem;
}
select {
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  margin-bottom:10px;
  width:100%;
}
.card {
  border-radius:15px;
  padding:20px;
  margin:10px 0;
  text-align:left;
  box-shadow:0 4px 10px rgba(0,0,0,0.05);
  min-height:100px;
  white-space:pre-wrap;
}
.button {
  margin:8px 5px;
  padding:12px 20px;
  background:#ff9f43;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
.button:hover {
  background:#ff7a00;
}
</style>
</head>

<body>
<div class="container">

<header>
<img src="버끼입체.png">
<h1>오늘의 루틴 & 응원</h1>
</header>

<select id="routineSelect">
<option value="">루틴 선택</option>
</select>

<div class="card" id="routineCard"></div>
<div class="card" id="bunnyMessage"></div>

<button class="button" onclick="doRoutine()">실행</button>
<button class="button" onclick="randomRoutine()">랜덤 🎲</button>
<button class="button" onclick="goToBlog()">종이 다운로드</button>

</div>

<script>

const routines = [
"3분 스트레칭","좋아하는 음악 듣기","감사한 일 3가지 적기",
"짧은 산책","명언 한 줄 읽기","10분 독서","물 한 잔 마시기",
"잠깐 명상","그림 그리기","간단 글쓰기","좋은 일 1가지 적기",
"햇빛 쬐기","기분 체크","몸 풀기","호흡 3분",
"정리정돈","안부 메시지","감사 떠올리기","간식 먹기",
"노래 듣기","긍정 문장","작은 목표","손편지","하루 계획",
"웃음 영상","좋아하는 장소","사진 찍기","기분 아이콘",
"10분 스트레칭","마음 다스리기"
];

const messages = [
"오늘도 잘했어요 🐰","작은 걸음도 의미 있어요",
"버터토끼가 응원해요","포기하지 마세요",
"행복 포인트 획득!","오늘도 빛나요",
"성장하고 있어요","스스로 칭찬하세요"
];

const select = document.getElementById("routineSelect");
const routineCard = document.getElementById("routineCard");
const bunnyCard = document.getElementById("bunnyMessage");

routines.forEach((r,i)=>{
  const opt = document.createElement("option");
  opt.value = i;
  opt.textContent = r;
  select.appendChild(opt);
});

// 하루 1회 체크
function canRunToday(){
  const today = new Date().toDateString();
  const done = localStorage.getItem("doneDate");
  if(done === today){
    alert("오늘은 이미 완료했어요 🐰");
    return false;
  }
  localStorage.setItem("doneDate", today);
  return true;
}

// 실행
function doRoutine(){
  if(!canRunToday()) return;

  const idx = select.value;
  if(idx === "") return alert("루틴 선택해주세요");

  const routine = routines[idx];
  const msg = messages[Math.floor(Math.random()*messages.length)];

  routineCard.innerHTML = `📝 ${routine}`;
  bunnyCard.innerHTML = `🐰 ${msg}`;

  localStorage.setItem("lastRoutine", routine);
  localStorage.setItem("lastMessage", msg);
}

// 랜덤
function randomRoutine(){
  const idx = Math.floor(Math.random()*routines.length);
  select.value = idx;
  doRoutine();
}

// 블로그 이동
function goToBlog(){
  if(confirm("종이 루틴 다운로드 하러 갈까요?")){
    window.location.href = "https://naver.com";
  }
}

</script>
</body>
</html>
