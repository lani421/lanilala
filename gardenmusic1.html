<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유칼립투스 정원 게임</title>

<style>
body{
    margin:0;
    font-family:"맑은 고딕", sans-serif;
    background:#f3f8f3;
    text-align:center;
}

/* 🌿 제목 */
h1{ margin-top:15px; color:#2d5a27; }
h2{ color:#4a6b45; }

/* 🎧 4개 음악 */
.music-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    width:90%;
    margin:20px auto;
}

.track{
    width:100%;
    height:80px;
    border-radius:10px;
}

/* 🧮 점수 */
.score-box{
    font-size:18px;
    margin:10px;
    font-weight:bold;
    color:#2d5a27;
}

/* 🌿 정원 */
.garden-wrap{
    position:relative;
    width:90%;
    margin:0 auto;
}

.background{
    width:100%;
    border-radius:20px;
}

/* 🌸 꽃 레이어 */
#flower-layer{
    position:absolute;
    width:100%;
    height:100%;
    top:0;
    left:0;
    pointer-events:none;
}

.flower{
    position:absolute;
    font-size:20px;
    animation:bloom 1s ease forwards;
}

@keyframes bloom{
    0%{ transform:scale(0); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
}

/* 🐾 캐릭터 */
.character{
    position:absolute;
    width:70px;
    cursor:pointer;
    transform-origin:center bottom;
}

.c1{ left:10%; bottom:30%; }
.c2{ left:30%; bottom:35%; }
.c3{ left:55%; bottom:30%; }
.c4{ left:75%; bottom:38%; }

/* 🎧 하단 플레이어 */
.bottom-player{
    margin:30px auto;
}

#mainPlayer{
    width:90%;
    height:80px;
    border-radius:10px;
}

/* 🎵 sway */
.sway{
    animation:sway 2s infinite ease-in-out;
}

@keyframes sway{
    0%{ transform:rotate(-5deg); }
    50%{ transform:rotate(5deg); }
    100%{ transform:rotate(-5deg); }
}

button{
    margin-top:10px;
    padding:10px 20px;
    border:none;
    border-radius:20px;
    background:#4a9c58;
    color:white;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>🌿 유칼립투스 정원 음악 게임</h1>
<h2>라니의 힐링 정원</h2>

<!-- 🎧 4개 음악 슬롯 -->
<div class="music-grid">

    <iframe class="track"
        src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/833903848&auto_play=false&visual=false">
    </iframe>

    <iframe class="track"
        src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/826203565&auto_play=false&visual=false">
    </iframe>

    <iframe class="track"
        src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/123456789&auto_play=false&visual=false">
    </iframe>

    <iframe class="track"
        src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/987654321&auto_play=false&visual=false">
    </iframe>

</div>

<!-- 🧮 점수 -->
<div class="score-box">
    🌸 Flowers Score: <span id="score">0</span>
</div>

<!-- 🌿 정원 -->
<div class="garden-wrap">

    <img src="flower_bg.png" class="background">

    <div id="flower-layer"></div>

    <!-- 🐾 캐릭터 -->
    <img src="h1.png" class="character c1" onclick="addScore(1)">
    <img src="h2.png" class="character c2" onclick="addScore(1)">
    <img src="h3.png" class="character c3" onclick="addScore(1)">
    <img src="h4.png" class="character c4" onclick="addScore(1)">

</div>

<!-- 🎧 하단 감상 플레이어 -->
<div class="bottom-player">

    <iframe id="mainPlayer"
        src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/833903848&auto_play=false&visual=false">
    </iframe>

    <button onclick="playMain()">▶ 음악 감상 시작</button>

</div>

<script>
let score = 0;

const scoreEl = document.getElementById("score");
const flowerLayer = document.getElementById("flower-layer");
const mainPlayer = document.getElementById("mainPlayer");
const characters = document.querySelectorAll(".character");

/* 🌸 점수 + 꽃 생성 */
function addScore(val){
    score += val;
    scoreEl.innerText = score;

    createFlower();
}

/* 🌸 꽃 생성 */
function createFlower(){

    const flower = document.createElement("div");
    flower.classList.add("flower");
    flower.innerText = "🌸";

    flower.style.left = Math.random()*80 + "%";
    flower.style.top = Math.random()*80 + "%";

    flowerLayer.appendChild(flower);

    setTimeout(()=>{
        flower.remove();
    },3000);
}

/* 🎧 하단 음악 감상 */
function playMain(){

    mainPlayer.src = mainPlayer.src; // reload

    characters.forEach(c=>{
        c.classList.add("sway");
    });
}

/* 🎵 음악 슬롯 클릭 → 점수 */
document.querySelectorAll(".track").forEach(track=>{
    track.addEventListener("click", ()=>{
        addScore(1);
    });
});
</script>

</body>
</html>
