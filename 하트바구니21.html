<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta name="viewport" 
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>HARVEST</title>


<style>

*{
    box-sizing:border-box;
    -webkit-user-select:none;
    user-select:none;
}


body{

    margin:0;

    height:100vh;

    background:hsl(162,76%,62%);

    color:white;

    font-family:Pretendard,sans-serif;

    display:flex;

    flex-direction:column;

    align-items:center;

    overflow:hidden;

}



h2{

    margin:20px 0 10px;

    font-weight:600;

}



.info-bar{

    display:flex;

    gap:25px;

    margin-bottom:15px;

    font-size:15px;

}



.game-area{

    position:relative;

    width:min(90vw,320px);

    height:min(110vw,420px);

    max-height:420px;

    background:linear-gradient(#d5a323,#bd8c0c);

    border:2px solid #9c7512;

    overflow:hidden;

    touch-action:none;

}



.basket{

    position:absolute;

    bottom:20px;

    width:70px;

    height:18px;

    background:white;

    border-radius:20px;

    opacity:.9;

}



.heart{

    position:absolute;

    width:18px;

    height:18px;

    background:#ff3030;

    transform:rotate(45deg);

    border-radius:3px;

}



.heart:before,
.heart:after{

    content:"";

    position:absolute;

    width:18px;

    height:18px;

    background:#ff3030;

    border-radius:50%;

}



.heart:before{

    top:-9px;

}



.heart:after{

    left:-9px;

}



.gameover{

    position:absolute;

    top:45%;

    width:100%;

    text-align:center;

    font-size:22px;

    font-weight:bold;

}


button{

    margin-top:20px;

    padding:12px 30px;

    border:0;

    border-radius:20px;

    background:white;

    color:#333;

    font-size:16px;

}



</style>

</head>


<body>


<h2>HARVEST</h2>


<div class="info-bar">

<div>
SCORE 
<span id="score">0</span>
</div>


<div>
MISS 
<span id="miss">0</span>
</div>


<div>
TIME 
<span id="time">60</span>
</div>


</div>



<div class="game-area" id="game">


<div class="basket" id="basket"></div>


</div>



<button onclick="restart()">
RESTART
</button>



<script>


const game=document.getElementById("game");

const basket=document.getElementById("basket");

const scoreText=document.getElementById("score");

const missText=document.getElementById("miss");

const timeText=document.getElementById("time");



let score=0;

let miss=0;

let time=60;

let basketX=125;

let playing=true;



const gameWidth=320;

const basketWidth=70;



basket.style.left=basketX+"px";



// =======================
// 바구니 이동
// =======================


function moveBasket(x){


    basketX=x;


    if(basketX<0)
        basketX=0;


    if(basketX>game.clientWidth-basketWidth)
        basketX=game.clientWidth-basketWidth;


    basket.style.left=basketX+"px";

}



// PC 키보드

document.addEventListener("keydown",e=>{


    if(!playing)return;


    if(e.key==="ArrowLeft")
        moveBasket(basketX-35);


    if(e.key==="ArrowRight")
        moveBasket(basketX+35);


});



// 모바일 터치

game.addEventListener("touchmove",e=>{


    if(!playing)return;


    e.preventDefault();


    let touch=e.touches[0];


    let rect=game.getBoundingClientRect();


    let x=
    touch.clientX-
    rect.left-
    basketWidth/2;


    moveBasket(x);



},{passive:false});




// =======================
// 하트 생성
// =======================


function createHeart(){


    if(!playing)return;



    let heart=document.createElement("div");


    heart.className="heart";


    let x=Math.random()*
    (game.clientWidth-20);


    heart.style.left=x+"px";

    heart.style.top="-20px";


    game.appendChild(heart);



    let y=-20;


    let speed=
    2+
    Math.random()*2;



    function fall(){


        if(!playing)return;



        y+=speed;


        heart.style.top=y+"px";



        // 충돌


        if(

            y+18 >= game.clientHeight-40

            &&

            x+18 >= basketX

            &&

            x <= basketX+basketWidth

        ){


            score++;


            scoreText.innerText=score;


            heart.remove();


            return;


        }



        // 놓침


        if(y>game.clientHeight){


            miss++;


            missText.innerText=miss;


            heart.remove();


            return;


        }


        requestAnimationFrame(fall);


    }



    requestAnimationFrame(fall);


}



// 랜덤 생성

function heartLoop(){


    if(!playing)return;


    createHeart();


    setTimeout(

        heartLoop,

        600+
        Math.random()*700

    );


}




// =======================
// 시간
// =======================


let timer=setInterval(()=>{


    if(!playing)return;


    time--;


    timeText.innerText=time;



    if(time<=0){


        endGame();


    }


},1000);




function endGame(){


    playing=false;


    clearInterval(timer);


    let msg=document.createElement("div");


    msg.className="gameover";


    msg.innerHTML=
    `
    GAME OVER<br>
    SCORE : ${score}
    `;


    game.appendChild(msg);


}




function restart(){


    location.reload();


}




heartLoop();



</script>


</body>
</html>
