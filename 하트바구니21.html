<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Harvest</title>

<style>
body {
  margin: 0;
  background: hsl(162, 76%, 62%);
  color: #eee;
  font-family: 'Pretendard', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
}

h2 {
  margin-top: 30px;
  font-weight: 500;
  letter-spacing: 1px;
}

.info-bar {
  display: flex;
  gap: 30px;
  margin: 15px 0;
  font-size: 14px;
  opacity: 0.8;
}

.game-area {
  position: relative;
  width: 320px;
  height: 400px;
  border: 1px solid #a17e15;
  background: linear-gradient(#c39516, #bf9713);
  overflow: hidden;
}

.basket {
  position: absolute;
  bottom: 20px;
  width: 70px;
  height: 15px;
  background: #fff;
  border-radius: 10px;
  opacity: 0.8;
  transition: left 0.08s ease-out;
}

.heart {
  position: absolute;
  width: 10px;
  height: 10px;
  background: #ff3b3b;
  transform: rotate(45deg);
  opacity: 0.9;
}

.heart::before,
.heart::after {
  content: "";
  position: absolute;
  width: 10px;
  height: 10px;
  background: #ff3b3b;
  border-radius: 50%;
}

.heart::before {
  top: -5px;
  left: 0;
}

.heart::after {
  left: -5px;
  top: 0;
}
</style>
</head>

<body>

<h2>HARVEST</h2>

<div class="info-bar">
  <div>SCORE <span id="score">0</span></div>
  <div>MISS <span id="missed">0</span></div>
  <div>TIME <span id="timer">60</span></div>
</div>

<div class="game-area" id="gameArea">
  <div class="basket" id="basket"></div>
</div>

<script>
const gameArea = document.getElementById('gameArea');
const basket = document.getElementById('basket');
const scoreDisplay = document.getElementById('score');
const missedDisplay = document.getElementById('missed');
const timerDisplay = document.getElementById('timer');

let score = 0;
let missed = 0;
let basketX = 120;

basket.style.left = basketX + "px";

// 부드러운 이동
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') {
    basketX -= 25;
  }
  if (e.key === 'ArrowRight') {
    basketX += 25;
  }

  basketX = Math.max(0, Math.min(250, basketX));
  basket.style.left = basketX + "px";
});

const fallDuration = 4500;

function dropHeart() {
  const heart = document.createElement('div');
  heart.classList.add('heart');

  const x = Math.random() * 300;
  heart.style.left = x + "px";
  heart.style.top = "-20px";

  gameArea.appendChild(heart);

  let start = null;

  function fall(t) {
    if (!start) start = t;
    const progress = (t - start) / fallDuration;

    const y = progress * 780;
    heart.style.top = y + "px";

    const hRect = heart.getBoundingClientRect();
    const bRect = basket.getBoundingClientRect();

    // 충돌
    if (
      hRect.bottom >= bRect.top &&
      hRect.left < bRect.right &&
      hRect.right > bRect.left
    ) {
      score++;
      scoreDisplay.textContent = score;
      heart.remove();
      return;
    }

    // 놓침
    if (y > 800) {
      missed++;
      missedDisplay.textContent = missed;
      heart.remove();
      return;
    }

    if (progress < 1) {
      requestAnimationFrame(fall);
    }
  }

  requestAnimationFrame(fall);
}

// 생성 간격 랜덤화 (더 자연스럽게)
setInterval(() => {
  dropHeart();
}, 700 + Math.random() * 600);

// 타이머
let time = 60;
const timer = setInterval(() => {
  time--;
  timerDisplay.textContent = time;

  if (time <= 0) {
    clearInterval(timer);
    alert(`Score: ${score} | Miss: ${missed}`);
  }
}, 1000);

</script>

</body>
</html>
