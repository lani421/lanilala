<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>씨앗의 접시</title>

  <style>
    body {
      font-family: 'NanumSquare', sans-serif;
      margin: 0;
      background-color: #faf9f6;
      color: #2f3a32;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .plate {
      max-width: 60%
      padding: 40px 25px;
      text-align: center;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 10px;
    }

    .keywords {
      font-size: 0.85rem;
      color: #6f7f75;
      margin-bottom: 30px;
    }

    img {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      margin-bottom: 30px;
    }

    .symbol {
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .question {
      font-size: 0.95rem;
      color: #3d4d43;
      border-top: 1px solid #dcdedc;
      padding-top: 25px;
    }

    a {
      display: inline-block;
      margin-top: 35px;
      font-size: 0.85rem;
      color: #6b8f7b;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="plate">
    <h1>접시 위의 씨앗</h1>
    <div class="keywords">희망</div>

    <img src="plate01.png" alt="씨앗의 접시">

    <div class="symbol">
       
       접시 위에 씨앗 하나가 올려져 있다.
    </div>

    <div class="question">
      내가 아직 키우지 못한 씨앗은 무엇일까?
      .<br>
      <strong>당신은 어떤 씨앗을 올릴 것인가 </strong>
    </div>

    <a href="index0.html">← 돌아가기</a><br>
    <a href="plate2.html" style="display:none;"> 다음 -> </a> 
</div>
</body>
</html>
