<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>씨앗의 접시</title>

<style>
body {
  font-family: 'NanumSquare', sans-serif;
  margin: 0;
  background-color: #faf9f6;
  color: #2f3a32;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.plate {
  max-width: 60%;
  padding: 40px 25px;
  text-align: center;
}

h1 {
  font-size: 1.6rem;
  margin-bottom: 10px;
}

.keywords {
  font-size: 0.85rem;
  color: #6f7f75;
  margin-bottom: 30px;
}

.plate-image {
  position: relative;
  width: 100%;
  max-width: 500px;
  margin: 0 auto 30px;
}

#seedPlate {
  width: 100%;
  display: block;
  cursor: pointer;
}

/* 새싹 */

#sprout {
  position: absolute;

  /* 씨앗 위치에 맞게 조절 */
  left: 50%;
  bottom: 32%;

  width: 175px;

  opacity: 0;

  transform:
    translateX(-50%)
    scaleY(0);

  transform-origin: bottom center;

  transition:
    transform 2s ease,
    opacity 1s ease;
}

/* 성장 */

#sprout.grow {
  opacity: 1;

  transform:
    translateX(-50%)
    scaleY(1);
}

/* 바람 흔들림 */

#sprout.sway {
  animation: springBreeze 3s ease-in-out;
}

@keyframes springBreeze {

  0% {
    transform: translateX(-50%) rotate(0deg);
  }

  15% {
    transform: translateX(-50%) rotate(-4deg);
  }

  30% {
    transform: translateX(-50%) rotate(3deg);
  }

  45% {
    transform: translateX(-50%) rotate(-3deg);
  }

  60% {
    transform: translateX(-50%) rotate(2deg);
  }

  80% {
    transform: translateX(-50%) rotate(-1deg);
  }

  100% {
    transform: translateX(-50%) rotate(0deg);
  }
}

.symbol {
  font-size: 0.95rem;
  line-height: 1.6;
  margin-bottom: 40px;
}

.question {
  font-size: 0.95rem;
  color: #3d4d43;
  border-top: 1px solid #dcdedc;
  padding-top: 25px;
}

a {
  display: inline-block;
  margin-top: 35px;
  font-size: 0.85rem;
  color: #6b8f7b;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="plate">

  <h1>접시 위의 씨앗</h1>

  <div class="keywords">
    희망
  </div>

  <div class="plate-image">

    <img
      src="plate01.png"
      alt="씨앗의 접시"
      id="seedPlate"
    >

    <img
      src="sprout.png"
      alt="새싹"
      id="sprout"
    >

  </div>

  <div class="symbol">
    click <br>
    접시 위에 씨앗 하나가 올려져 있다.
  </div>

  <div class="question" id="questionText">
    내가 아직 키우지 못한 씨앗은 무엇일까?<br>
    <strong>당신은 어떤 씨앗을 올릴 것인가.</strong>
  </div>

  <a href="index0.html">← 돌아가기</a><br>
  <a href="plate2.html">다음 →</a>

</div>

<!-- 봄바람 소리 -->
<audio id="springWind" preload="auto">
  <source src="spring-wind.mp3" type="audio/mpeg">
</audio>

<script>

const plate = document.getElementById("seedPlate");
const sprout = document.getElementById("sprout");
const wind = document.getElementById("springWind");
const question = document.getElementById("questionText");

let grown = false;

plate.addEventListener("click", () => {

  if(grown) return;

  grown = true;

  // 봄바람
  wind.currentTime = 0;
  wind.volume = 0.7;
  wind.play();

  // 새싹 성장
  sprout.classList.add("grow");

  // 문구 변화
  setTimeout(() => {

    question.innerHTML =
      "씨앗은 이미 자라기 시작했다.<br><strong>모든 성장은 누군가의 기다림에서 시작된다.</strong>";

  }, 1500);

  // 성장 후 흔들림
  setTimeout(() => {

    sprout.classList.add("sway");

  }, 2000);

});

</script>

</body>
</html>
