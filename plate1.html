<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>씨앗의 접시</title>

<style>

body {
  font-family: 'NanumSquare', sans-serif;
  margin: 0;
  background-color: #faf9f6;
  color: #2f3a32;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.plate {
  max-width: 60%;
  padding: 40px 25px;
  text-align: center;
}

h1 {
  font-size: 1.6rem;
  margin-bottom: 10px;
}

.keywords {
  font-size: 0.85rem;
  color: #6f7f75;
  margin-bottom: 30px;
}


/* =====================
   접시 + 새싹
===================== */

.plate-image {
  position: relative;
  display: inline-block;
}


/* 접시 이미지 */

#seedPlate {
  height: 260px;
  width: auto;
  display: block;
  cursor: pointer;
  object-fit: contain;
}


/* 새싹 */

#sprout {
  position: absolute;
  left: 50%;
  bottom: 35%;
  width: 160px;

  opacity: 0;

  transform: translateX(-50%) scaleY(0);
  transform-origin: bottom center;

  transition:
    transform 2s ease,
    opacity 1s ease;
}


/* 새싹 성장 */

#sprout.grow {
  opacity: 1;
  transform: translateX(-50%) scaleY(1);
}


/* 새싹 흔들림 */

#sprout.sway {
  animation: springBreeze 3s ease-in-out;
}


@keyframes springBreeze {

  0% {
    transform: translateX(-50%) scaleY(1) rotate(0deg);
  }

  15% {
    transform: translateX(-50%) scaleY(1) rotate(-4deg);
  }

  30% {
    transform: translateX(-50%) scaleY(1) rotate(3deg);
  }

  45% {
    transform: translateX(-50%) scaleY(1) rotate(-3deg);
  }

  60% {
    transform: translateX(-50%) scaleY(1) rotate(2deg);
  }

  80% {
    transform: translateX(-50%) scaleY(1) rotate(-1deg);
  }

  100% {
    transform: translateX(-50%) scaleY(1) rotate(0deg);
  }

}


/* =====================
   씨앗 안내 문구
===================== */

.symbol {
  font-size: 0.95rem;
  line-height: 1.6;
  margin-bottom: 40px;
}


.question {
  font-size: 0.95rem;
  color: #3d4d43;

  border-top: 1px solid #dcdedc;

  padding-top: 25px;
}


/* =====================
   숲으로 이동 영역
===================== */

/*
   처음에는 보이지 않음.
   접시를 클릭한 뒤 JavaScript에서
   .show 클래스를 추가하면 나타남.
*/

.forestLink {

  margin-top: 80px;

  text-align: center;

  opacity: 0;

  transform: translateY(20px);

}


/* 등장 */

.forestLink.show {

  animation: fadeIn 2s ease forwards;

}


.line {

  width: 80px;

  height: 1px;

  background: #cfd8d5;

  margin: 0 auto 50px;

}


.forestLink p {

  font-size: 0.95rem;

  line-height: 2;

  color: #52635a;

  margin-bottom: 35px;

}


.forestLink a {

  display: inline-block;

  padding: 14px 35px;

  border: 1px solid #70857b;

  color: #536960;

  text-decoration: none;

  font-size: 0.85rem;

  letter-spacing: 0.05em;

  transition: 0.4s;

}


.forestLink a:hover {

  background: #536960;

  color: white;

}


/* =====================
   등장 효과
===================== */

@keyframes fadeIn {

  from {

    opacity: 0;

    transform: translateY(20px);

  }

  to {

    opacity: 1;

    transform: translateY(0);

  }

}
hr {
  border: 0;
  border-top: 1px solid #333435;
  width: 80px;
  margin: 50px auto;
}

</style>
</head>


<body>

<div class="plate">

  <h1>접시 위의 씨앗</h1>


  <div class="plate-image">

    <img
      src="plate01.png"
      alt="씨앗의 접시"
      id="seedPlate"
    >

    <img
      src="sprout.png"
      alt="새싹"
      id="sprout"
    >

  </div>


  <div class="symbol">

    <br>
    씨앗을 살며시 눌러 보세요~
    <br><br>

  </div>


  <div class="question" id="questionText">

    내가 아직 키우지 못한 씨앗은
    <br>

    무엇일까?
    <br><br>

    <strong>
      어떤 씨앗을 올릴 것인가.
    </strong>

  </div>

  
  <!-- =====================
       숲으로 이동
  ====================== -->

  <div class="forestLink">

    
    <hr>
    <p>

      오늘의 접시 위의 이야기는
      <br>

      여기까지입니다.

    </p>


    <a href="index.html">
      HOME
    </a>

  </div>

</div>


<script>

const plate = document.getElementById("seedPlate");
const sprout = document.getElementById("sprout");
const question = document.getElementById("questionText");
const forestLink = document.querySelector(".forestLink");

let grown = false;


plate.addEventListener("click", () => {

  // 한 번만 실행
  if (grown) return;

  grown = true;


  /* =====================
     1. 새싹 성장
  ====================== */

  sprout.classList.add("grow");


  /* =====================
     2. 1.5초 후 문구 변경
  ====================== */

  setTimeout(() => {

    question.innerHTML = `
      씨앗은 이미 자라기 시작했다.<br>
      <strong>
       <br> 모든 성장은 <br>
        누군가의 기다림에서 시작된다.
      </strong>
    `;

  }, 1500);


  /* =====================
     3. 2초 후 새싹 흔들림
  ====================== */

  setTimeout(() => {

    sprout.classList.add("sway");

  }, 2000);


  /* =====================
     4. 3초 후 숲으로 이동 영역 등장
  ====================== */

  setTimeout(() => {

    forestLink.classList.add("show");

  }, 3000);

});

</script>

</body>
</html>
