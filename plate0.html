<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>얼음의 접시</title>

<style>
body {
  font-family: 'NanumSquare', sans-serif;
  margin: 0;
  background-color: #faf9f6;
  color: #2f3a32;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.plate {
  max-width: 50%;
  padding: 40px 25px;
  text-align: center;
}

h1 {
  font-size: 1.6rem;
  margin-bottom: 10px;
}

.keywords {
  font-size: 0.85rem;
  color: #6f7f75;
  margin-bottom: 30px;
}

#plateImg {
  width: 100%;
  max-height: 260px;
  object-fit: contain;
  margin-bottom: 30px;
  cursor: pointer;
  transition: transform 0.3s ease;
  transform-origin: center center;
}

.symbol {
  font-size: 0.95rem;
  line-height: 1.6;
  margin-bottom: 40px;
}

.question {
  font-size: 0.95rem;
  color: #3d4d43;
  border-top: 1px solid #dcdedc;
  padding-top: 25px;
}

a {
  display: inline-block;
  margin-top: 35px;
  font-size: 0.85rem;
  color: #6b8f7b;
  text-decoration: none;
}

/* 접시 흔들림 */
.shake {
  animation: windMove 1.4s ease;
}

@keyframes windMove {
  0% {
    transform: scale(1) rotate(0deg);
  }
  15% {
    transform: scale(1.02) rotate(-3deg);
  }
  30% {
    transform: scale(1.04) rotate(3deg);
  }
  45% {
    transform: scale(1.03) rotate(-2deg);
  }
  60% {
    transform: scale(1.05) rotate(2deg);
  }
  80% {
    transform: scale(1.02) rotate(-1deg);
  }
  100% {
    transform: scale(1) rotate(0deg);
  }
}

/* 바람이 스쳐가는 듯한 그림자 */
.glow {
  filter: drop-shadow(0 0 18px rgba(180, 200, 220, 0.5));
}
</style>
</head>

<body>

<div class="plate">

  <h1>얼음의 빈 접시</h1>

  <div class="keywords">
    생존
  </div>

  <img
    src="plate001.png"
    alt="얼음의 접시"
    id="plateImg"
  >

  <div class="symbol">
    click ^ <br>
    얼음같은 공간에 놓인 접시는<br>
    아직 중심을 잡고 있다.
  </div>

  <div class="question">
    이 접시가 비어 있는 이유는 <br>
    아직 올려두지 못한 것이 있기 때문이다.<br>
    <strong>당신은 무엇을 아직 올리지 못했는가?</strong>
  </div>

  <a href="index0.html">← 돌아가기</a><br>
  <a href="plate1.html">다음 →</a>

</div>

<audio id="windSound" preload="auto">
  <source src="wind.mp3" type="audio/mpeg">
</audio>

<script>
const plate = document.getElementById("plateImg");
const wind = document.getElementById("windSound");

plate.addEventListener("click", () => {

  // 애니메이션 재시작
  plate.classList.remove("shake");
  plate.classList.remove("glow");

  void plate.offsetWidth;

  plate.classList.add("shake");
  plate.classList.add("glow");

  setTimeout(() => {
    plate.classList.remove("glow");
  }, 1400);

  // 바람 소리 재생
  wind.pause();
  wind.currentTime = 0;
  wind.volume = 0.75;

  wind.play().catch(error => {
    console.log(error);
  });

});
</script>

</body>
</html>
