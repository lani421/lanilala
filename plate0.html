<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>얼음의 접시</title>

  <style>
    body {
      font-family: 'NanumSquare', sans-serif;
      margin: 0;
      background-color: #faf9f6;
      color: #2f3a32;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .plate {
      max-width: 520px;
      padding: 40px 25px;
      text-align: center;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 10px;
    }

    .keywords {
      font-size: 0.85rem;
      color: #6f7f75;
      margin-bottom: 30px;
    }

    img {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      margin-bottom: 30px;
    }

    .symbol {
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .question {
      font-size: 0.95rem;
      color: #3d4d43;
      border-top: 1px solid #dcdedc;
      padding-top: 25px;
    }

    a {
      display: inline-block;
      margin-top: 35px;
      font-size: 0.85rem;
      color: #6b8f7b;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="plate">
    <h1>얼음의 빈 접시</h1>
    <div class="keywords">생존</div>

    <img src="plate001.png" alt="얼음의 접시">

    <div class="symbol">
       
       얼음같은 공간에 놓인 접시는<br> 
      아직 중심을 잡고 있다.
    </div>

    <div class="question">
      이 접시가 비어 있는 이유는 <br> 
      아직 올려두지 못한 것이 있기 때문이다.<br>
      <strong>당신은 무엇을 아직 올리지 못했는가?</strong>
    </div>

    <a href="index.html">← 돌아가기</a><br>
    <a href="plate1.html"> 다음 -> </a> 
  </div>
</body>
</html>
