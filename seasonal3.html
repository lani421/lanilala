<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>하트플랜트 저널</title>

<style>
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  body{
    font-family:'NanumSquare', sans-serif;
    overflow-x: scroll;
    overflow-y: hidden;
    background:#faf9f6;

    /* 가로 스냅 */
    scroll-snap-type: x mandatory;
    display:flex;

    height:100vh;
  }

  /* 각 페이지 */
  .page{
    min-width:100vw;
    height:100vh;

    scroll-snap-align:start;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:40px;
    position:relative;
  }

  /* 페이지마다 다른 배경 */
  .page:nth-child(1){
    background:linear-gradient(to bottom,#d8e8df,#edf4ef);
  }

  .page:nth-child(2){
    background:#f8f3ea;
  }

  .page:nth-child(3){
    background:#f3ece7;
  }

  .page:nth-child(4){
    background:#eef3ef;
  }

  h1,h2{
    color:#27423b;
    margin-bottom:20px;
  }

  p{
    color:#556b5f;
    margin-bottom:30px;
  }

  .season-gallery{
    width:320px;
  }

  .season-gallery img{
    width:100%;
    height:220px;
    object-fit:cover;

    border-radius:16px;
    cursor:pointer;

    box-shadow:0 8px 20px rgba(0,0,0,0.12);

    transition:0.3s;
  }

  .season-gallery img:hover{
    transform:scale(1.03);
  }

  /* 하단 안내 */
  .hint{
    position:absolute;
    bottom:30px;
    font-size:14px;
    color:#777;
  }
</style>

<script>
function openImagePopup(pageUrl) {

  const popupWidth = 700;
  const popupHeight = 700;

  const left = (screen.width - popupWidth) / 2;
  const top = (screen.height - popupHeight) / 2;

  window.open(
    pageUrl,
    "_blank",
    `width=${popupWidth},
    height=${popupHeight},
    left=${left},
    top=${top}`
  );
}
</script>
</head>

<body>

<!-- 첫 페이지 -->
<section class="page">
  <h1>하트나무저널</h1>
  <p>숲에서 펼쳐지는 기록</p>

  <div class="season-gallery">
    <img src="미로와 라니.jpg"
         onclick="openImagePopup('하트1.html')">
  </div>

  <div class="hint">→ 옆으로 스크롤</div>
</section>

<!-- 두 번째 페이지 -->
<section class="page" style="display:none;" >
  <h2>하튼 열매 수확하기</h2>

  <div class="season-gallery">
    <img src="하트토끼열매.PNG"
         onclick="openImagePopup('하트바구니21.html')">
  </div>
</section>

<!-- 세 번째 페이지 -->
<section class="page">
  <h2>하트잼 만들기</h2>

  <div class="season-gallery">
    <img src="하트잼.png"
         onclick="openImagePopup('하트3.html')">
  </div>
</section>

<!-- 네 번째 페이지 -->
<section class="page" style="display:none;" >
  <h2>하트플랜트 저널 쓰기</h2>

  <div class="season-gallery">
    <img src="하트그림4.PNG"
         onclick="openImagePopup('하트4.html')">
  </div>
</section>

</body>
</html>
